<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Night Roulette</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#24132e;color:white;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}.app{width:min(100%,420px);text-align:center}.heart{font-size:48px}h1{font-size:30px;margin:12px 0 5px}.subtitle{color:#dabed9;margin-bottom:38px}.label{font-weight:650;margin-bottom:15px}.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.category{border:1px solid #57375e;background:#382344;color:white;border-radius:16px;padding:16px 4px;cursor:pointer;font-size:14px}.category span{display:block;font-size:28px;margin-bottom:8px}.category.active{background:#a43e80;border-color:#f6a3d2}.result{background:#382344;border-radius:22px;min-height:225px;margin:20px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}.result .emoji{font-size:42px}.result h2{font-size:23px;margin:15px 0 8px}.result p{color:#e7cde5;line-height:1.5;margin:0}.surprise{width:100%;border:0;background:#e46baa;color:#24132e;border-radius:15px;padding:18px;font-weight:800;font-size:18px;cursor:pointer}.surprise:active{transform:scale(.98)}footer{font-size:12px;color:#c7a9c9;margin-top:24px}
</style>
</head>
<body><main class="app"><div class="heart">💗</div><h1>Date Night Roulette</h1><p class="subtitle">Less planning. More loving.</p><p class="label">What's your mood tonight?</p><div class="categories"><button class="category active" data-category="romantic"><span>💕</span>Romantic</button><button class="category" data-category="fun"><span>🎉</span>Fun</button><button class="category" data-category="home"><span>🏠</span>At Home</button></div><section class="result" aria-live="polite"><div class="emoji" id="emoji">🎲</div><h2 id="idea">Your next date awaits...</h2><p id="description">Choose your vibe and let fate plan your perfect date!</p></section><button class="surprise" id="surprise">🎲 Surprise Me!</button><footer>Made with love · Version 1</footer></main>
<script>
const ideas={romantic:[['Sunset Picnic','Pack a blanket, some snacks and watch the sunset together.'],['Love Letter Night','Write each other a sweet letter and read them aloud.'],['Stargazing Date','Grab a warm drink and find a quiet spot under the stars.'],['Breakfast Date','Surprise each other with a homemade breakfast.']],fun:[['Mystery Snack Challenge','Pick three surprise snacks for each other and rate them.'],['Random Adventure','Choose a direction and discover somewhere new.'],['Couple Photo Challenge','Take five funny photos together in unusual poses.'],['Game Night','Compete in your favorite board or card game.']],home:[['Cozy Movie Night','Make popcorn, build a blanket fort and watch a movie.'],['Cook Together','Pick a recipe neither of you has tried before.'],['Living Room Spa','Put on relaxing music and enjoy a home spa evening.'],['Indoor Picnic','Spread a blanket on the floor and enjoy your favorite snacks.']]};
const icons={romantic:'💕',fun:'🎉',home:'🏠'};let category='romantic',previous=-1;
document.querySelectorAll('.category').forEach(button=>button.addEventListener('click',()=>{category=button.dataset.category;previous=-1;document.querySelectorAll('.category').forEach(b=>b.classList.toggle('active',b===button));document.getElementById('emoji').textContent='🎲';document.getElementById('idea').textContent='Your next date awaits...';document.getElementById('description').textContent='Choose your vibe and let fate plan your perfect date!'}));
document.getElementById('surprise').addEventListener('click',()=>{const list=ideas[category];let next=Math.floor(Math.random()*list.length);if(list.length>1&&next===previous)next=(next+1+Math.floor(Math.random()*(list.length-1)))%list.length;previous=next;document.getElementById('emoji').textContent=icons[category];document.getElementById('idea').textContent=list[next][0];document.getElementById('description').textContent=list[next][1]});
</script></body></html>
